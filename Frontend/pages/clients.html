<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Клієнти - Requirements System</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        #dataTable th:nth-child(1) { width: 5%; } 
        #dataTable th:nth-child(2) { width: 25%; }
        #dataTable th:nth-child(3) { width: 25%; }
        #dataTable th:nth-child(4) { width: 15%; } 
        #dataTable th:nth-child(5) { width: 15%; }
        #dataTable th:nth-child(6) { width: 15%; }

        .date-cell { color: #000; font-weight: 500; }
        .time-cell { color: #888; font-size: 0.85em; margin-top: 2px; }
    </style>
</head>
<body>

<header>
    <div class="logo">Requirements Tracking System</div>
    <div>
        Вітаємо, <span id="currentUserName" class="user-info">...</span>!
        <button class="logout-btn" onclick="logout()">Вийти</button>
    </div>
</header>

<div class="side-accent">
    <img src="../images/logo.png" alt="Logo" class="side-logo">
    <div class="nav-menu">
        <a href="lobby.html" class="nav-item">
            <img src="../images/homeIcon.png" alt="Logo" class="side-icon">
            <span>Home</span>
        </a>
        <a href="clients.html" class="nav-item active">
            <img src="../images/clientIcon.png" alt="Logo" class="side-icon">
            <span>Clients</span>
        </a>
        <a href="projects.html" class="nav-item">
            <img src="../images/folderIcon.png" alt="Logo" class="side-icon">
            <span>Projects</span>
        </a>
        <a href="requirements.html" class="nav-item">
            <img src="../images/requirementIcon.png" alt="Logo" class="side-icon">
            <span>Reqs</span>
        </a>
    </div>
</div>

<div style="display: flex; justify-content: space-between; align-items: center; padding: 2rem 2rem 1rem 2rem;">
    <h2 style="margin: 0; font-weight: 500;">Клієнти</h2>
    <button id="openModalBtn" style="background: #7300ff; color: white; border: none; padding: 10px 20px; border-radius: 10px; cursor: pointer; font-weight: bolder;">
        Додати клієнта
    </button>
</div>

<div class="container">
    <table id="dataTable">
        <thead>
            <tr>
                <th>ID</th>
                <th>ПІБ</th>
                <th>Імейл</th>
                <th>Проєкти</th>
                <th>Дата реєстрації</th>
                <th>Дії</th>
            </tr>
        </thead>
        <tbody id="clientsBody"></tbody>
    </table>
</div>

<div id="clientModal" style="display:none; position: fixed; z-index: 1100; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5);">
    <div style="background-color: white; margin: 10% auto; padding: 20px; border-radius: 8px; width: 400px; box-shadow: 0 5px 15px rgba(0,0,0,0.3);">
        <h3 id="modalTitle">Новий клієнт</h3>
        <form id="addClientForm">
            <label>Ім'я:</label>
            <input type="text" id="clientFirstName" style="width:100%; margin: 5px 0 15px 0; padding: 5px; box-sizing: border-box;" required>

            <label>Прізвище:</label>
            <input type="text" id="clientLastName" style="width:100%; margin: 5px 0 15px 0; padding: 5px; box-sizing: border-box;" required>

            <label>Імейл:</label>
            <input type="email" id="clientEmail" style="width:100%; margin: 5px 0 15px 0; padding: 5px; box-sizing: border-box;" required>

            <div style="margin-top: 20px; display: flex; justify-content: space-between;">
                <button type="button" id="closeModalBtn" style="background:#6c757d; color:white; border:none; padding:8px 15px; border-radius:4px; cursor: pointer;">Скасувати</button>
                <button type="submit" style="background:#007bff; color:white; border:none; padding:8px 15px; border-radius:4px; cursor: pointer;">Зберегти</button>
            </div>
        </form>
    </div>
</div>

<div id="contextMenu" class="action-menu">
    <button onclick="handleEditFromMenu()">Edit</button>
    <button class="delete-btn-menu" onclick="handleDeleteFromMenu()">Delete</button>
</div>

<div id="deleteConfirmModal" style="display:none; position: fixed; z-index: 1200; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5);">
    <div class="confirm-modal-content">
        <h3>Ви впевнені, що хочете це видалити?</h3>
        <p>Ця дія є безповоротною</p>
        <div class="btn-group-confirm">
            <button class="btn-cancel" onclick="closeDeleteModal()">Скасувати</button>
            <button class="btn-delete-final" id="confirmDeleteBtn">Видалити</button>
        </div>
    </div>
</div>

<script type="module">
    import { clientApi } from '../js/api/clientApi.js';
    let selectedId = null;
    let editMode = false;
    let currentEditId = null;
    let currentRegistrationDate = null;

    const modal = document.getElementById('clientModal');
    const modalHeader = document.getElementById('modalTitle');
    const openBtn = document.getElementById('openModalBtn');
    const closeBtn = document.getElementById('closeModalBtn');
    const form = document.getElementById('addClientForm');

    document.getElementById('currentUserName').innerText = localStorage.getItem('userName') || 'Гість';

    window.logout = () => {
        localStorage.clear();
        window.location.href = 'login.html';
    };

    window.showActionMenu = (event, id) => {
        event.stopPropagation(); 
        selectedId = id;
        const menu = document.getElementById('contextMenu');
        
        menu.style.display = 'block';
        menu.style.left = `${event.pageX - 100}px`;
        menu.style.top = `${event.pageY + 10}px`;
    };

    document.addEventListener('click', () => {
        document.getElementById('contextMenu').style.display = 'none';
    });

    function formatDateTime(isoString) {
        if (!isoString) return '-';
        const date = new Date(isoString);
        
        const datePart = date.toLocaleDateString('uk-UA', { 
            day: '2-digit', month: '2-digit', year: 'numeric',
            timeZone: 'Europe/Kyiv'
        });

        const timePart = date.toLocaleTimeString('uk-UA', { 
            hour: '2-digit', minute: '2-digit',
            timeZone: 'Europe/Kyiv'
        });

        return `
            <div class="date-cell">${datePart}</div>
            <div class="time-cell">${timePart}</div>
        `;
    }

    async function loadClients() {
        try {
            const clients = await clientApi.getAll();
            const body = document.getElementById('clientsBody');

            if (!clients || clients.length === 0) {
                body.innerHTML = '<tr><td colspan="6" style="text-align:center;">Клієнтів поки немає.</td></tr>';
                return;
            }

            body.innerHTML = clients.map(client => {
                const fName = client.firstName || client.FirstName || '';
                const lName = client.lastName || client.LastName || '';
                const fullName = `${fName} ${lName}`.trim() || 'Без імені';
                const projectsCount = client.projects ? client.projects.length : 0;
                const dateToFormat = client.createdAt || client.CreatedAt;

                return `
                    <tr>
                        <td>${client.id}</td>
                        <td>${fullName}</td>
                        <td>${client.email || client.Email || '-'}</td>
                        <td >${projectsCount}</td>
                        <td>${formatDateTime(dateToFormat)}</td>
                        <td>
                            <button onclick="showActionMenu(event, ${client.id})" style="background:#d4d4d4; border:none; border-radius:4px; cursor:pointer; padding:3px 10px;">•••</button>
                        </td>
                    </tr>
                `;
            }).join('');
        } catch (err) {
            console.error("Помилка завантаження клієнтів:", err);
        }
    }

    window.openEditModal = async (id) => {
        try {
            const client = await clientApi.getById(id);
            
            document.getElementById('clientFirstName').value = client.firstName || client.FirstName || '';
            document.getElementById('clientLastName').value = client.lastName || client.LastName || '';
            document.getElementById('clientEmail').value = client.email || '';
            
            currentRegistrationDate = client.startDate || client.registrationDate;

            modalHeader.innerText = "Редагувати дані клієнта";
            editMode = true;
            currentEditId = id;
            modal.style.display = "block";
        } catch (err) {
            alert("Помилка завантаження даних клієнта");
        }
    };
    window.handleEditFromMenu = () => {
        document.getElementById('contextMenu').style.display = 'none';
        window.openEditModal(selectedId);
    };

    window.handleDeleteFromMenu = () => {
        document.getElementById('contextMenu').style.display = 'none';
        document.getElementById('deleteConfirmModal').style.display = 'block';
    };

    window.closeDeleteModal = () => {
        document.getElementById('deleteConfirmModal').style.display = 'none';
    };

    document.getElementById('confirmDeleteBtn').onclick = async () => {
        try {
            await clientApi.delete(selectedId);
            window.closeDeleteModal();
            loadClients(); 
        } catch (err) {
            console.error("Помилка при видаленні:", err);
            alert("Не вдалося видалити клієнта. Можливо, у нього є активні проєкти?");
        }
    };

    const deleteModal = document.getElementById('deleteConfirmModal');
    window.addEventListener('click', (event) => {
        if (event.target === deleteModal) {
            window.closeDeleteModal();
        }
    });

    openBtn.onclick = () => {
        editMode = false;
        currentEditId = null;
        currentRegistrationDate = null;
        modalHeader.innerText = "Новий клієнт";
        form.reset();
        modal.style.display = "block";
    };

    closeBtn.onclick = () => {
        modal.style.display = "none";
    };

    window.onclick = (event) => {
        if (event.target == modal) modal.style.display = "none";
    };

    form.onsubmit = async (e) => {
        e.preventDefault();
        
        const now = new Date();
        const offset = now.getTimezoneOffset() * 60000;
        const localISOTime = new Date(now - offset).toISOString().slice(0, -1) + "+03:00";

        const clientData = {
            FirstName: document.getElementById('clientFirstName').value,
            LastName: document.getElementById('clientLastName').value,
            Email: document.getElementById('clientEmail').value,
            CreatedAt: editMode ? currentRegistrationDate : localISOTime 
        };

        if (editMode) {
            clientData.Id = currentEditId;
        }

        try {
            if (editMode) {
                await clientApi.update(currentEditId, clientData);
            } else {
                await clientApi.create(clientData);
            }
            modal.style.display = "none";
            loadClients();
        } catch (err) {
            console.error("Помилка збереження:", err);
            alert("Не вдалося зберегти дані");
        }
    };

    loadClients();
</script>
</body>
</html>
