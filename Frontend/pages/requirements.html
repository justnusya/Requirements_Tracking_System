<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Вимоги - Requirements System</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        #dataTable th:nth-child(1) { width: 5%; } 
        #dataTable th:nth-child(2) { width: 20%; }
        #dataTable th:nth-child(3) { width: 25%; } 
        #dataTable th:nth-child(4) { width: 15%; } 
        #dataTable th:nth-child(5) { width: 12%; }
        #dataTable th:nth-child(6) { width: 13%; } 
        #dataTable th:nth-child(7) { width: 10%; } 
    </style>
</head>
<body>

<header>
    <div class="logo">Requirements Tracking System</div>
    <div>
        Вітаємо, <span id="currentUserName" class="user-info">...</span>!
        <button class="logout-btn" onclick="logout()">Вийти</button>
    </div>
</header>

<div class="side-accent">
    <img src="../images/logo.png" alt="Logo" class="side-logo">
    <div class="nav-menu">
        <a href="lobby.html" class="nav-item">
            <img src="../images/homeIcon.png" alt="Logo" class="side-icon">
            <span>Home</span>
        </a>
        <a href="clients.html" class="nav-item">
            <img src="../images/clientIcon.png" alt="Logo" class="side-icon">
            <span>Clients</span>
        </a>
        <a href="projects.html" class="nav-item">
            <img src="../images/folderIcon.png" alt="Logo" class="side-icon">
            <span>Projects</span>
        </a>
        <a href="requirements.html" class="nav-item active">
            <img src="../images/requirementIcon.png" alt="Logo" class="side-icon">
            <span>Reqs</span>
        </a>
    </div>
</div>

<div style="display: flex; justify-content: space-between; align-items: center; padding: 2rem 2rem 1rem 2rem;">
    <h2 style="margin: 0; font-weight: 500;">Список вимог</h2>
    <button id="openModalBtn" style="background: #7300ff; color: white; border: none; padding: 10px 20px; border-radius: 10px; cursor: pointer; font-weight: bolder;">
        Додати вимогу
    </button>
</div>

<div class="container">
    <table id="dataTable">
        <thead>
            <tr>
                <th>ID</th>
                <th>Назва</th>
                <th>Опис</th>
                <th>Проєкт</th>
                <th>Пріоритет</th>
                <th>Статус</th>
                <th>Дії</th>
            </tr>
        </thead>
        <tbody id="requirementsBody"></tbody>
    </table>
</div>

<div id="requirementModal" style="display:none; position: fixed; z-index: 1100; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5);">
    <div style="background-color: white; margin: 10% auto; padding: 20px; border-radius: 8px; width: 400px; box-shadow: 0 5px 15px rgba(0,0,0,0.3);">
        <h3>Нова вимога</h3>
        <form id="addRequirementForm">
            <label>Назва:</label>
            <input type="text" id="reqTitle" style="width:100%; margin: 10px 0;" required>
            
            <label>Опис:</label>
            <textarea id="reqDescription" style="width:100%; margin: 10px 0;" rows="3"></textarea>

            <label>Проєкт:</label>
            <select id="reqProject" style="width:100%; margin: 10px 0; padding: 5px;" required>
                <option value="">Оберіть проєкт...</option>
            </select>

            <label>Пріоритет:</label>
            <select id="reqPriority" style="width:100%; margin: 10px 0;">
                <option value="Low">Низький</option>
                <option value="Medium">Середній</option>
                <option value="High">Високий</option>
            </select>

            <label>Статус:</label>
            <select id="reqStatus" style="width:100%; margin: 10px 0;">
                <option value="1">Нова</option>
                <option value="2">Заплановано</option>
                <option value="3">В роботі</option>
                <option value="4">Виконано</option>
            </select>

            <div style="margin-top: 20px; display: flex; justify-content: space-between;">
                <button type="button" id="closeModalBtn" style="background:#6c757d; color:white; border:none; padding:8px 15px; border-radius:4px; cursor: pointer;">Скасувати</button>
                <button type="submit" style="background:#007bff; color:white; border:none; padding:8px 15px; border-radius:4px; cursor: pointer;">Зберегти</button>
            </div>
        </form>
    </div>
</div>

<script type="module">
    import { requirementApi } from '../js/api/requirementApi.js';
    import { projectApi } from '../js/api/projectApi.js';
    
    let currentCreatedAt = null;
    let editMode = false;
    let currentEditId = null;

    const modal = document.getElementById('requirementModal');
    const modalTitle = document.querySelector('#requirementModal h3');
    const openBtn = document.getElementById('openModalBtn');
    const closeBtn = document.getElementById('closeModalBtn');
    const form = document.getElementById('addRequirementForm');
    const projectSelect = document.getElementById('reqProject');

    document.getElementById('currentUserName').innerText = localStorage.getItem('userName') || 'Гість';

    window.logout = () => {
        localStorage.clear();
        window.location.href = 'login.html';
    };

    async function loadRequirements() {
        try {
            const requirements = await requirementApi.getAll();
            const body = document.getElementById('requirementsBody');
            
            if (!requirements || requirements.length === 0) {
                body.innerHTML = '<tr><td colspan="7">Вимог поки немає. Додайте першу!</td></tr>';
                return;
            }

            body.innerHTML = requirements.map(req => {
                const priorityText = req.priorityId === 3 ? "Високий" : req.priorityId === 2 ? "Середній" : "Низький";
                const statusText = 
                    req.statusId === 1 ? "Нова" : 
                    req.statusId === 2 ? "Заплановано" : 
                    req.statusId === 3 ? "В роботі" : "Виконано";

                return `
                    <tr>
                        <td>${req.id}</td>
                        <td>${req.title}</td>
                        <td>${req.description || '-'}</td>
                        <td>${req.project ? (req.project.projectName || req.project.name) : 'null в обєкті'}</td>
                        <td>${priorityText}</td>
                        <td>${statusText}</td>
                        <td>
                            <button onclick="openEditModal(${req.id})" style="background:#d4d4d4; border:none; border-radius:4px; cursor:pointer; padding:3px 10px;">•••</button>
                        </td>
                    </tr>
                `;
            }).join('');
        } catch (err) {
            console.error("Не вдалося завантажити вимоги", err);
        }
    }

    async function loadProjectsToSelect() {
        try {
            const projects = await projectApi.getAll();
            projectSelect.innerHTML = '<option value="">Оберіть проєкт...</option>';
            projects.forEach(proj => {
                const option = document.createElement('option');
                option.value = proj.id;
                option.textContent = proj.projectName;
                projectSelect.appendChild(option);
            });
        } catch (err) {
            console.error("Не вдалося завантажити список проєктів", err);
        }
    }

    window.openEditModal = async (id) => {
        try {
            const req = await requirementApi.getById(id);
            document.getElementById('reqTitle').value = req.title;
            document.getElementById('reqDescription').value = req.description || '';
            document.getElementById('reqPriority').value = req.priorityId === 3 ? "High" : req.priorityId === 2 ? "Medium" : "Low";
            document.getElementById('reqStatus').value = req.statusId.toString();
            document.getElementById('reqProject').value = req.projectId;

            modalTitle.innerText = "Редагувати вимогу";
            editMode = true;
            currentEditId = id;
            currentCreatedAt = req.createdAt; 
            modal.style.display = "block";
        } catch (err) {
            alert("Помилка завантаження даних");
        }
    };

    openBtn.onclick = () => {
        editMode = false;
        currentEditId = null;
        modalTitle.innerText = "Нова вимога до ПЗ";
        form.reset();
        document.getElementById('reqStatus').value = "1"; 
        modal.style.display = "block";
    };

    closeBtn.onclick = () => { modal.style.display = "none"; };

    form.onsubmit = async (e) => {
        e.preventDefault();
        const requirementData = {
            Id: editMode ? parseInt(currentEditId) : 0,
            Title: document.getElementById('reqTitle').value,
            Description: document.getElementById('reqDescription').value,
            PriorityId: document.getElementById('reqPriority').value === "High" ? 3 : 
                        document.getElementById('reqPriority').value === "Medium" ? 2 : 1,
            StatusId: parseInt(document.getElementById('reqStatus').value), 
            ProjectId: parseInt(document.getElementById('reqProject').value), 
            AuthorId: parseInt(localStorage.getItem('userId')),
            CreatedAt: editMode ? currentCreatedAt : new Date().toISOString(),
            UpdatedAt: new Date().toISOString()
        };

        try {
            if (editMode) {
                await requirementApi.update(currentEditId, requirementData);
            } else {
                await requirementApi.create(requirementData);
            }
            modal.style.display = "none";
            loadRequirements();
        } catch (err) {
            console.error("Помилка при збереженні:", err);
        }
    };
    loadProjectsToSelect();
    loadRequirements();
</script>
</body>
</html>
